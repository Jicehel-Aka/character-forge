<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {FBXLoader} from 'three/addons/loaders/FBXLoader.js';

async function load(url){
  const ext = url.split('?')[0].split('.').pop().toLowerCase();
  if (ext==='glb'||ext==='gltf'){ const g = await new GLTFLoader().loadAsync(url); return {root:g.scene, clips:g.animations}; }
  if (ext==='fbx'){ const o = await new FBXLoader().loadAsync(url); return {root:o, clips:o.animations||[]}; }
  if (ext==='obj'){ const o = await new OBJLoader().loadAsync(url); return {root:o, clips:[]}; }
  throw new Error('format non géré: '+ext);
}
function info(root, clips){
  const bones=[]; let tris=0, mats=new Set(), tex=[];
  root.traverse(o=>{ if(o.isBone) bones.push(o.name);
    if(o.isMesh){ const g=o.geometry; tris += (g.index? g.index.count : g.attributes.position.count)/3;
      [].concat(o.material).forEach(m=>{ mats.add(m.name||'(sans nom)'); for(const k of ['map','normalMap','roughnessMap','metalnessMap','emissiveMap']) if(m[k]) tex.push(k+':'+(m[k].image?.width||'?')+'x'+(m[k].image?.height||'?')); }); } });
  const box = new THREE.Box3().setFromObject(root); const s=new THREE.Vector3(); box.getSize(s);

}

  const scene = new THREE.Scene(); const pivot = new THREE.Group(); scene.add(pivot); pivot.add(root);

  const sun = new THREE.DirectionalLight(0xffffff, o.sun ?? 1.6); sun.position.set(-0.55,1.0,0.45).multiplyScalar(10); scene.add(sun);

  // cadrage : boîte englobante sur toute l'animation (échantillonnée), pieds au sol, centré

  let lo=new THREE.Vector3(1e9,1e9,1e9), hi=new THREE.Vector3(-1e9,-1e9,-1e9);

  const b0=new THREE.Box3().setFromObject(root,true); const h=b0.max.y-b0.min.y; const cx=(b0.min.x+b0.max.x)/2, cz=(b0.min.z+b0.max.z)/2;
  root.position.set(-cx,-b0.min.y,-cz);                 // pieds au sol, centré sur la pose de repos

  const cen = new THREE.Vector3(0,(o.center ?? 0.5)*h,0), dist=100;

</script>
