  for(let t=0;t<idx.length;t+=3){ const pr=part(idx[t]);
    if(pr==='body'){ for(let q=0;q<3;q++) bidx.push(take(idx[t+q])); }
    else { const pp=props[pr]; for(let q=0;q<3;q++){ const i=idx[t+q]; let k=pp.map.get(i); if(k===undefined){ k=pp.pos.length/3; pp.map.set(i,k); const [x,y,z]=map(P.getX(i),P.getY(i),P.getZ(i)); pp.pos.push(x,y,z); pp.nor.push(N.getX(i),N.getY(i),N.getZ(i)); pp.uv.push(UV.getX(i),1-UV.getY(i)); } pp.idx.push(k); } } }
  const tex=await new THREE.TextureLoader().loadAsync(o.texture); tex.colorSpace=THREE.SRGBColorSpace; tex.flipY=false; tex.wrapS=tex.wrapT=THREE.RepeatWrapping;

  const root=SkeletonUtils.clone(S); let sm; root.traverse(c=>{ if(c.isSkinnedMesh) sm=c; });
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

      const T=new THREE.Matrix4().makeTranslation(-gp.x,-gp.y,-gp.z); const R=new THREE.Matrix4().makeRotationFromEuler(new THREE.Euler(...(off.rot||[0,0,0]).map(d=>d*Math.PI/180)));
      const B=new THREE.Matrix4().makeTranslation(...(off.pos||[0,0,0]).map(x=>x*100)); pg.applyMatrix4(new THREE.Matrix4().multiplyMatrices(B,new THREE.Matrix4().multiplyMatrices(R,T))); }
    const m=new THREE.Mesh(pg,mat); m.name=name; bones[bi].add(m); return pp.idx.length/3; };
  const rep_={}; rep_.axe=attach('Axe',o.axeBone||'mixamorigRightHand',props.axe,o.axe||{grip:[-63.5,48,-29]}); rep_.shield=attach('Shield',o.shieldBone||'mixamorigLeftForeArm',props.shield,o.shield||{grip:[62,50,-25],rot:[0,90,0]});
  // clips
  const clips=[]; for(const c of (o.clips||[])){ const A=(await load(c.url)).clips[0]; if(A){ A.name=c.name; clips.push(A); } }
  const out=new THREE.Group(); out.name='Armature'; out.scale.setScalar(1e-4); out.add(root); const scene=new THREE.Scene(); scene.add(out);
  const buf=await new Promise((ok,ko)=> new GLTFExporter().parse(scene, ok, ko, {binary:true, animations:clips}));
  let bin=''; const u8=new Uint8Array(buf); for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return {glb:btoa(bin), body:bidx.length/3, props:rep_, clips:clips.map(c=>c.name), ratio:r, islands:[...role.values()].reduce((a,v)=>(a[v]=(a[v]||0)+1,a),{})};
};
